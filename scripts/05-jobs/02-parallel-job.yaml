apiVersion: batch/v1
kind: Job
metadata:
  name: parallel-sweep-job
spec:
  # Kubernetes equivalent to Slurm job arrays (--array=0-5%3):
  # Injects JOB_COMPLETION_INDEX (0..5) into each worker pod!
  completionMode: Indexed
  parallelism: 3
  completions: 6
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: sweep-worker
        image: python:3.12-slim
        command:
        - python3
        - -c
        - |
          import math, os, socket, time
          idx = int(os.environ.get("JOB_COMPLETION_INDEX", "0"))
          lr = 1e-4 * (2 ** idx)
          loss = round(1.0 / (1.0 + math.log2(idx + 2)), 4)
          time.sleep(2)
          print(f"[Rank {idx}/5 on {socket.gethostname()}] lr={lr:.6f} -> val_loss={loss}")
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
