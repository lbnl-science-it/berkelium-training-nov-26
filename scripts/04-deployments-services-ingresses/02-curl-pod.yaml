apiVersion: v1
kind: Pod
metadata:
  name: test-curl-pod
spec:
  containers:
  - name: curl
    image: curlimages/curl:8.11.0
    command: ["sh", "-c", "echo 'Curl test pod ready' && sleep 1800"]
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
