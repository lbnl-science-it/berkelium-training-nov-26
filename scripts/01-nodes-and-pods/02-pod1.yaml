apiVersion: v1
kind: Pod
metadata:
  name: test-pod
spec:
  containers:
  - name: mypod
    image: ubuntu:24.04
    command: ["sh", "-c", "echo 'Hello from Berkelium interactive pod!' && uname -a && sleep 1800"]
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
