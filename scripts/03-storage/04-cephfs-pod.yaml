apiVersion: v1
kind: Pod
metadata:
  name: cephfs-pod
spec:
  containers:
  - name: cephfs-container
    image: ubuntu:24.04
    command: ["sh", "-c", "df -h /shared-data && sleep 1800"]
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    volumeMounts:
    - name: cephfs-volume
      mountPath: /shared-data
  volumes:
  - name: cephfs-volume
    persistentVolumeClaim:
      claimName: cephfs-pvc
