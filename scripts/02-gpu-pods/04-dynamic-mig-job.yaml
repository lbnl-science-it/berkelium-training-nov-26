apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: mig-slice-claim
spec:
  spec:
    devices:
      requests:
      - name: mig-gpu
        exactly:
          deviceClassName: mig.nvidia.com
          allocationMode: ExactCount
          count: 1
          selectors:
          - cel:
              # Matches a 1-slice hardware-isolated MIG partition on A100/H100 (1g.10gb), H200 (1g.18gb), RTX PRO 6000 Blackwell (1g.24gb), or B300 (1g.34gb)
              expression: device.attributes["gpu.nvidia.com"].profile in ["1g.10gb", "1g.18gb", "1g.24gb", "1g.34gb"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dynamic-mig-job
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      resourceClaims:
      - name: mig-gpu
        resourceClaimTemplateName: mig-slice-claim
      containers:
      - name: mig-worker
        image: nvidia/cuda:12.8.0-base-ubuntu24.04
        command: ["sh", "-c", "echo '=== Hardware-Isolated Dynamic MIG Slice ===' && nvidia-smi -L && nvidia-smi"]
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "2"
            memory: 8Gi
          claims:
          - name: mig-gpu
