apiVersion: v1
kind: Pod
metadata:
  name: failing-pod
spec:
  restartPolicy: Never
  containers:
  - name: failing-container
    image: ubuntu:24.04
    command: ["sh", "-c", "echo 'Starting simulation...' && sleep 2 && echo 'ERROR: Missing input dataset /data/input.h5' >&2 && exit 1"]
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
