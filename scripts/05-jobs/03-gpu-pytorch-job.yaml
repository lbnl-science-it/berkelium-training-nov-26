apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: pytorch-gpu-claim
spec:
  spec:
    devices:
      requests:
      - name: gpu
        # Automatically selects whichever NVIDIA GPU pool (or Dynamic MIG slice) has free capacity!
        firstAvailable:
        - name: rtx6000
          deviceClassName: nvidia-rtx6000
          allocationMode: ExactCount
          count: 1
        - name: a40
          deviceClassName: nvidia-a40
          allocationMode: ExactCount
          count: 1
        - name: h200
          deviceClassName: nvidia-h200
          allocationMode: ExactCount
          count: 1
        - name: a100
          deviceClassName: nvidia-a100
          allocationMode: ExactCount
          count: 1
        - name: h100
          deviceClassName: nvidia-h100
          allocationMode: ExactCount
          count: 1
        - name: b300
          deviceClassName: nvidia-b300
          allocationMode: ExactCount
          count: 1
        - name: mig-slice
          deviceClassName: mig.nvidia.com
          allocationMode: ExactCount
          count: 1
          selectors:
          - cel:
              expression: device.attributes["gpu.nvidia.com"].profile in ["1g.10gb", "1g.18gb", "1g.24gb", "1g.34gb"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-pytorch-job
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      resourceClaims:
      - name: gpu
        resourceClaimTemplateName: pytorch-gpu-claim
      containers:
      - name: pytorch-benchmark
        # Berkelium's local Harbor PyTorch 2.14 + CUDA 13.0 image (supports A40, A100, H100, H200, RTX PRO 6000 & B300 Blackwell!)
        image: harbor.bk.lbl.gov/coder-images/pytorch:a0d801e4
        command:
        - python3
        - -c
        - |
          import time, torch
          assert torch.cuda.is_available(), "CUDA GPU not detected!"
          name = torch.cuda.get_device_name(0)
          vram = torch.cuda.get_device_properties(0).total_memory / (1024**3)
          x = torch.randn((8192, 8192), device="cuda", dtype=torch.bfloat16)
          torch.cuda.synchronize()
          t0 = time.perf_counter()
          for _ in range(10):
              y = x @ x
          torch.cuda.synchronize()
          dt = time.perf_counter() - t0
          tflops = (2 * (8192**3) * 10) / dt / 1e12
          print(f"GPU: {name} ({vram:.1f} GiB) | BF16 MatMul: {tflops:.2f} TFLOPS | Exiting cleanly.")
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 8Gi
          claims:
          - name: gpu
