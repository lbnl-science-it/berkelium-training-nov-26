apiVersion: v1
kind: Pod
metadata:
  name: rbd-pod
spec:
  containers:
  - name: rbd-container
    image: ubuntu:24.04
    command: ["sh", "-c", "df -h /workspace && sleep 1800"]
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    volumeMounts:
    - name: rbd-volume
      mountPath: /workspace
  volumes:
  - name: rbd-volume
    persistentVolumeClaim:
      claimName: rbd-pvc
