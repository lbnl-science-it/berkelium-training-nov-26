apiVersion: batch/v1
kind: Job
metadata:
  name: nvidia-smi-job
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: nvidia-smi-container
        image: nvidia/cuda:12.8.0-base-ubuntu24.04
        command: ["nvidia-smi"]
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
            # Choose an available GPU pool: nvidia.com/rtx6000, nvidia.com/a40, nvidia.com/h200, nvidia.com/a100, nvidia.com/h100, nvidia.com/b300
            nvidia.com/rtx6000: "1"
          limits:
            cpu: "1"
            memory: 2Gi
            nvidia.com/rtx6000: "1"
