apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
spec:
  containers:
  - name: web-server
    image: nginx:1.27-alpine
    ports:
    - containerPort: 80
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  - name: sidecar
    image: busybox:1.36
    command: ["sh", "-c", "for i in $(seq 1 60); do echo \"[$(date -Iseconds)] Sidecar health check #$i\"; wget -qO- http://127.0.0.1:80 >/dev/null && echo '  nginx localhost:80 OK'; sleep 30; done"]
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
